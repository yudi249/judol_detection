[project]
name = "judol-detection"
version = "0.1.0"
description = "Monorepo skripsi untuk deteksi promosi judi online berbahasa Indonesia yang robust terhadap manipulasi Unicode."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "json5>=0.15.0",
    "camoufox>=0.5.3",
    "lingua-language-detector>=2.2.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "python-dotenv>=1.1.0",
    "playwright>=1.57.1,<1.61",
    "pyarrow>=24.0.0",
    "telethon>=1.44.0",
    "yt-dlp>=2026.7.4",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "transformers>=5.17.0",
    "torch>=2.14.0",
    "pyyaml>=6.0.3",
    "accelerate>=1.1.0",
    "onnxruntime>=1.24.1",
]

[project.scripts]
judol-detection = "main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-work-20260714 -p no:cacheprovider"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "onnx>=1.20.0",
]
