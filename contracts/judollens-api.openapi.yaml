openapi: 3.1.0
info:
  title: JudolLens Prediction API
  version: 1.0.0
  description: Local inference contract for the JudolLens browser extension.
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          $ref: "#/components/responses/HealthReady"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /predict:
    post:
      operationId: predictOne
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionRequest"
      responses:
        "200":
          $ref: "#/components/responses/PredictionResponse"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /predict/batch:
    post:
      operationId: predictBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionBatchRequest"
      responses:
        "200":
          $ref: "#/components/responses/PredictionBatchResponse"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/QueueSaturated"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  schemas:
    PredictionItem:
      type: object
      additionalProperties: false
      required: [id, text, context]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        text:
          type: string
          minLength: 1
          maxLength: 512
        context:
          $ref: "#/components/schemas/PredictionItemContext"
    PredictionItemContext:
      type: object
      additionalProperties: false
      required: [kind, visible]
      properties:
        kind:
          type: string
          enum: [comment, post, message, title, description, unknown]
        selector_hint:
          type: string
          minLength: 1
          maxLength: 512
        visible:
          type: boolean
        language_hint:
          type: string
          enum: [id, en, unknown]
    PredictionSource:
      type: object
      additionalProperties: false
      required: [platform, captured_at]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        platform:
          type: string
          enum: [youtube, telegram, x, simulation, unknown]
        page_title:
          type: string
          minLength: 1
          maxLength: 512
        captured_at:
          type: string
          format: date-time
    PredictionClient:
      type: object
      additionalProperties: false
      required: [extension_version, prediction_mode, threshold]
      properties:
        extension_version:
          type: string
          minLength: 1
          maxLength: 128
        prediction_mode:
          type: string
          enum: [mock, api, offline]
        threshold:
          type: number
          exclusiveMinimum: 0
          maximum: 1
    PredictionRequest:
      type: object
      additionalProperties: false
      required: [request_id, source, client, item]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        source:
          $ref: "#/components/schemas/PredictionSource"
        client:
          $ref: "#/components/schemas/PredictionClient"
        item:
          $ref: "#/components/schemas/PredictionItem"
    PredictionBatchRequest:
      type: object
      additionalProperties: false
      required: [request_id, source, client, items]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        source:
          $ref: "#/components/schemas/PredictionSource"
        client:
          $ref: "#/components/schemas/PredictionClient"
        items:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/PredictionItem"
    PredictionModelInfo:
      type: object
      additionalProperties: false
      required: [name, version, architecture, is_mock]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          minLength: 1
          maxLength: 128
        architecture:
          type: string
          minLength: 1
          maxLength: 128
        is_mock:
          type: boolean
    DetectionReason:
      type: object
      additionalProperties: false
      required: [type, value, weight]
      properties:
        type:
          type: string
          enum: [keyword, unicode, model_signal]
        value:
          type: string
          minLength: 1
          maxLength: 512
        weight:
          type: number
    UnicodeSpan:
      type: object
      additionalProperties: false
      required: [start, end, char, reason]
      properties:
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        char:
          type: string
          minLength: 1
          maxLength: 1
        reason:
          type: string
          enum: [homoglyph, invisible, symbol, mixed_script, unknown]
        normalized_as:
          type: string
          minLength: 1
          maxLength: 1
        unicode_name:
          type: string
          minLength: 1
          maxLength: 256
    UnicodeAnalysis:
      type: object
      additionalProperties: false
      required: [has_suspicious_unicode, suspicious_count, spans]
      properties:
        has_suspicious_unicode:
          type: boolean
        suspicious_count:
          type: integer
          minimum: 0
        spans:
          type: array
          items:
            $ref: "#/components/schemas/UnicodeSpan"
    HighlightRange:
      type: object
      additionalProperties: false
      required: [start, end, kind]
      properties:
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        kind:
          type: string
          enum: [matched_term, unicode_suspicious]
    PredictionDisplay:
      type: object
      additionalProperties: false
      required: [snippet, highlight_ranges]
      properties:
        snippet:
          type: string
          maxLength: 512
        highlight_ranges:
          type: array
          items:
            $ref: "#/components/schemas/HighlightRange"
    PredictionResult:
      type: object
      additionalProperties: false
      required:
        [id, label, confidence, risk_level, action, reasons, matched_terms, unicode_analysis, display]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        label:
          type: string
          enum: [judol, non_judol]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        risk_level:
          type: string
          enum: [low, medium, high]
        action:
          type: string
          enum: [none, warn, blur, hide]
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/DetectionReason"
        matched_terms:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        unicode_analysis:
          $ref: "#/components/schemas/UnicodeAnalysis"
        display:
          $ref: "#/components/schemas/PredictionDisplay"
    PredictionSummary:
      type: object
      additionalProperties: false
      required: [total_items, judol_count, unicode_suspicious_count, processing_time_ms]
      properties:
        total_items:
          type: integer
          minimum: 0
        judol_count:
          type: integer
          minimum: 0
        unicode_suspicious_count:
          type: integer
          minimum: 0
        processing_time_ms:
          type: integer
          minimum: 0
    PredictionError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        item_id:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 512
    PredictionResponse:
      type: object
      additionalProperties: false
      required: [request_id, model, result, errors]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        model:
          $ref: "#/components/schemas/PredictionModelInfo"
        result:
          $ref: "#/components/schemas/PredictionResult"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PredictionError"
    PredictionBatchResponse:
      type: object
      additionalProperties: false
      required: [request_id, model, summary, results, errors]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        model:
          $ref: "#/components/schemas/PredictionModelInfo"
        summary:
          $ref: "#/components/schemas/PredictionSummary"
        results:
          type: array
          items:
            $ref: "#/components/schemas/PredictionResult"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PredictionError"
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, api_version, model]
      properties:
        status:
          type: string
          const: ready
        api_version:
          type: string
          minLength: 1
          maxLength: 128
        model:
          $ref: "#/components/schemas/PredictionModelInfo"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 512
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
          maxLength: 128
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [status]
          properties:
            status:
              const: 422
    QueueSaturatedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [status, code]
          properties:
            status:
              const: 429
            code:
              const: inference_queue_saturated
    ServiceUnavailableProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [status, code]
          properties:
            status:
              const: 503
            code:
              const: model_unavailable
  responses:
    HealthReady:
      description: The API is ready to serve inference requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    PredictionResponse:
      description: Prediction for one text item.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PredictionResponse"
    PredictionBatchResponse:
      description: Predictions for a bounded batch of text items.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PredictionBatchResponse"
    ValidationProblem:
      description: The request body does not satisfy the contract.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    QueueSaturated:
      description: The inference queue cannot accept another batch.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/QueueSaturatedProblem"
    ServiceUnavailable:
      description: The model is unavailable for inference.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ServiceUnavailableProblem"
