<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JudolLens X Timeline Coverage Fixture</title>
    <style>
      body {
        background: #000;
        color: #e7e9ea;
        font-family: "Segoe UI", system-ui, sans-serif;
        margin: 0;
      }

      main {
        margin: 24px auto;
        max-width: 640px;
      }

      [data-testid="tweet"] {
        border: 1px solid #2f3336;
        border-radius: 16px;
        box-sizing: border-box;
        margin: 16px 0;
        min-height: 132px;
        padding: 16px;
      }

      [data-surface] {
        color: #71767b;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      [data-testid="tweetText"] {
        line-height: 1.45;
        margin-top: 12px;
      }

      a {
        color: #1d9bf0;
        display: inline-block;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main aria-label="X timeline coverage fixture">
      <article data-testid="tweet">
        <div data-surface="home">home</div>
        <a href="/example/status/2099429059063341101">permalink</a>
        <div data-testid="tweetText">Test-only home timeline card</div>
      </article>

      <article data-testid="tweet">
        <div data-surface="profile">profile</div>
        <a href="/example/status/2099429059063341102">permalink</a>
        <div data-testid="tweetText">Test-only profile timeline card</div>
      </article>

      <article data-testid="tweet">
        <div data-surface="detail">detail</div>
        <a href="/example/status/2099429059063341103">permalink</a>
        <div data-testid="tweetText">Test-only detail timeline card</div>
      </article>

      <article data-testid="tweet">
        <div data-surface="reply">reply</div>
        <a href="/example/status/2099429059063341104">permalink</a>
        <div data-testid="tweetText">Test-only reply timeline card</div>
      </article>

      <article data-testid="tweet">
        <div data-surface="unrelated">unrelated</div>
        <a href="/example/status/2099429059063341105">permalink</a>
        <div data-testid="tweetText">Test-only unrelated timeline card</div>
      </article>
    </main>
  </body>
</html>
